<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание Гитарника</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #17110f;
            --bg-2: #231915;
            --amber: #f0b46c;
            --amber-deep: #d98e4a;
            --terracotta: #d9825b;
            --cream: #f7ede0;
            --cream-dim: rgba(247, 237, 224, 0.55);
            --cream-faint: rgba(247, 237, 224, 0.32);
            --glass: rgba(255, 238, 216, 0.05);
            --glass-hover: rgba(255, 238, 216, 0.09);
            --stroke: rgba(255, 238, 216, 0.09);
            --stroke-hover: rgba(240, 180, 108, 0.5);
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --sans: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            color: var(--cream);
            min-height: 100vh;
            padding: 56px 20px 80px;
            background:
                radial-gradient(900px 500px at 12% -5%, rgba(217, 142, 74, 0.20), transparent 60%),
                radial-gradient(800px 600px at 95% 15%, rgba(150, 70, 80, 0.16), transparent 60%),
                radial-gradient(900px 700px at 50% 110%, rgba(217, 130, 91, 0.14), transparent 60%),
                linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }
        /* мягкое зерно */
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            opacity: 0.05; mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* ============ ОСЕННИЕ ЛИСТЬЯ ============ */
        .leaves {
            position: fixed; inset: 0;
            pointer-events: none; overflow: hidden;
            z-index: 1;
        }
        .leaf {
            position: absolute; top: -140px;
            animation: fall linear infinite;
            will-change: transform;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
        }
        .leaf.blur { filter: blur(2.5px) drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }
        @keyframes fall {
            0%   { transform: translate3d(0, -140px, 0) rotate(0deg); opacity: 0; }
            8%   { opacity: var(--op, 0.5); }
            50%  { transform: translate3d(calc(var(--drift) * -0.6), 52vh, 0) rotate(calc(var(--rot) * 0.5)); }
            92%  { opacity: calc(var(--op, 0.5) * 0.7); }
            100% { transform: translate3d(var(--drift), 112vh, 0) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            max-width: 860px; margin: 0 auto;
            position: relative; z-index: 2;
        }

        /* ============ ШАПКА ============ */
        .header { text-align: center; margin-bottom: 44px; }
        .header .ornament {
            color: var(--amber); letter-spacing: 10px; font-size: 14px; opacity: 0.8;
            margin-bottom: 10px;
        }
        .header h1 {
            font-family: var(--serif);
            font-size: 64px; font-weight: 700; line-height: 1;
            letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(180deg, #ffd9a0 0%, var(--amber) 45%, var(--terracotta) 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            filter: drop-shadow(0 4px 22px rgba(240, 160, 80, 0.25));
        }
        .header .subtitle {
            font-family: var(--serif); font-style: italic;
            font-size: 22px; color: var(--cream-dim);
            margin-top: 12px;
        }
        .header .divider {
            width: 140px; height: 1px; margin: 22px auto 0;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }

        /* ============ ПОИСК ============ */
        .search-box { text-align: center; margin-bottom: 36px; }
        .search-box input {
            width: 100%; max-width: 460px;
            padding: 14px 26px; border-radius: 50px;
            border: 1px solid var(--stroke);
            background: var(--glass);
            color: var(--cream); font-family: var(--sans); font-size: 15px;
            outline: none; transition: 0.3s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .search-box input:focus {
            border-color: var(--stroke-hover);
            background: var(--glass-hover);
            box-shadow: 0 0 0 4px rgba(240, 180, 108, 0.08), 0 10px 40px rgba(0,0,0,0.25);
        }
        .search-box input::placeholder { color: var(--cream-faint); }

        /* ============ РАСПИСАНИЕ (таймлайн) ============ */
        .schedule {
            display: flex; flex-direction: column; gap: 12px;
            position: relative; padding-left: 34px;
        }
        .schedule::before {
            content: ''; position: absolute; left: 9px; top: 18px; bottom: 18px; width: 1px;
            background: linear-gradient(180deg, transparent, rgba(240,180,108,0.45) 8%, rgba(240,180,108,0.45) 92%, transparent);
        }

        .row {
            position: relative;
            display: flex; align-items: center;
            background: var(--glass);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 16px 24px;
            cursor: pointer; transition: 0.28s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .row::before { /* точка таймлайна */
            content: ''; position: absolute; left: -30px; top: 50%;
            width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%;
            background: var(--bg-1);
            border: 2px solid var(--amber-deep);
            box-shadow: 0 0 0 4px rgba(217, 142, 74, 0.12);
            transition: 0.28s;
        }
        .row:hover {
            background: var(--glass-hover);
            border-color: var(--stroke-hover);
            transform: translateX(5px);
            box-shadow: 0 14px 40px rgba(0,0,0,0.3), 0 0 30px rgba(240,160,80,0.06);
        }
        .row:hover::before {
            background: var(--amber);
            box-shadow: 0 0 0 5px rgba(240, 180, 108, 0.2), 0 0 14px rgba(240,180,108,0.6);
        }

        .time-block {
            display: flex; flex-direction: column; align-items: flex-start;
            width: 96px; flex-shrink: 0;
        }
        .time-main {
            font-family: var(--serif);
            font-size: 28px; font-weight: 700; line-height: 1;
            color: var(--amber);
            letter-spacing: 0.5px;
            font-variant-numeric: lining-nums;
        }
        .time-old {
            font-family: var(--sans);
            font-size: 17px; font-weight: 700;
            color: rgba(247, 237, 224, 0.8);
            text-decoration: line-through;
            text-decoration-color: rgba(255, 90, 60, 1);
            text-decoration-thickness: 2px;
            line-height: 1; margin-bottom: 5px;
        }

        .name {
            font-size: 16.5px; font-weight: 600;
            color: var(--cream); flex: 1; line-height: 1.35;
        }
        .badge {
            font-size: 11.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            color: var(--amber);
            border: 1px solid rgba(240,180,108,0.35);
            background: rgba(240,180,108,0.08);
            padding: 4px 11px; border-radius: 20px;
            margin-left: 12px; white-space: nowrap;
        }

        /* ============ КНОПКА НАЗАД ============ */
        .back {
            display: inline-block; margin: 6px 0 26px;
            padding: 9px 24px; border-radius: 50px;
            border: 1px solid var(--stroke);
            background: var(--glass);
            color: var(--amber); font-family: var(--sans); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: 0.25s;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .back:hover {
            background: rgba(240, 180, 108, 0.14);
            border-color: var(--stroke-hover);
            transform: translateX(-3px);
        }

        .artist-title {
            font-family: var(--serif);
            font-size: 44px; font-weight: 700; line-height: 1.1;
            color: var(--amber);
            margin-bottom: 26px;
            text-shadow: 0 4px 24px rgba(240,160,80,0.2);
        }

        /* ============ ПЕСНИ ============ */
        .song {
            display: flex; align-items: center; gap: 18px;
            background: var(--glass);
            border: 1px solid var(--stroke);
            padding: 16px 22px; margin-bottom: 11px;
            border-radius: 16px;
            cursor: pointer; transition: 0.25s;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .song:hover {
            background: var(--glass-hover);
            border-color: var(--stroke-hover);
            transform: translateX(4px);
        }
        .song .num {
            font-family: var(--serif); font-size: 30px; font-weight: 600;
            color: var(--amber-deep); opacity: 0.8;
            width: 34px; text-align: center; flex-shrink: 0; line-height: 1;
        }
        .song .title { font-size: 17px; font-weight: 600; color: var(--cream); }
        .song .author { font-size: 13.5px; color: var(--cream-dim); margin-top: 3px; }

        /* ============ ССЫЛКИ ============ */
        .links-box {
            margin-top: 30px; padding: 22px 26px;
            background: var(--glass);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .links-box .links-title {
            font-size: 12px; font-weight: 700; letter-spacing: 3px;
            text-transform: uppercase; color: var(--amber);
            opacity: 0.8; margin-bottom: 14px;
        }
        .links-box a {
            display: inline-block; margin: 4px 8px 4px 0;
            padding: 9px 20px; border-radius: 30px;
            background: rgba(240, 180, 108, 0.1);
            border: 1px solid rgba(240, 180, 108, 0.28);
            color: #ffd9a0; text-decoration: none;
            font-size: 14px; font-weight: 600; transition: 0.2s;
            word-break: break-all;
        }
        .links-box a:hover {
            background: rgba(240, 180, 108, 0.22);
            border-color: rgba(240, 180, 108, 0.65);
            transform: translateY(-2px);
        }

        /* ============ ТЕКСТ ПЕСНИ ============ */
        .lyrics-box {
            background: var(--glass);
            border: 1px solid var(--stroke);
            border-radius: 24px;
            padding: 44px 40px; margin-top: 6px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .lyrics-box .big-title {
            font-family: var(--serif);
            font-size: 42px; font-weight: 700; line-height: 1.1; color: var(--amber);
        }
        .lyrics-box .big-author {
            font-family: var(--serif); font-style: italic;
            font-size: 20px; color: var(--cream-dim);
            margin: 8px 0 0;
        }
        .lyrics-box .divider {
            width: 90px; height: 1px; margin: 24px auto 28px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }
        .lyrics-box .text {
            font-family: var(--serif);
            font-size: 21px; line-height: 1.85; font-weight: 500;
            color: rgba(250, 240, 226, 0.92);
            white-space: pre-wrap;
        }

        .page { display: block; }
        .page.hidden { display: none; }

        .fade { animation: fade 0.45s ease; }
        @keyframes fade {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 36px 14px 60px; }
            .header h1 { font-size: 38px; letter-spacing: 1.5px; }
            .header .subtitle { font-size: 18px; }
            .schedule { padding-left: 26px; }
            .schedule::before { left: 6px; }
            .row { padding: 13px 16px; flex-wrap: wrap; gap: 4px 12px; }
            .row::before { left: -24px; width: 9px; height: 9px; margin-top: -4.5px; }
            .time-block { width: auto; }
            .time-main { font-size: 24px; }
            .name { font-size: 15px; }
            .artist-title { font-size: 32px; }
            .lyrics-box { padding: 28px 20px; }
            .lyrics-box .big-title { font-size: 30px; }
            .lyrics-box .text { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="leaves" id="leaves"></div>

    <div class="container">

        <div class="header">
            <div class="ornament">✦ ✦ ✦</div>
            <h1>Гитарник</h1>
            <div class="subtitle">Осенний вечер выступлений</div>
            <div class="divider"></div>
        </div>

        <div class="search-box" id="searchBox">
            <input type="text" id="searchInput" placeholder="Найти исполнителя..." oninput="applyFilter()" />
        </div>

        <div id="pageMain" class="page">
            <div id="schedule" class="schedule"></div>
        </div>

        <div id="pageSongs" class="page hidden">
            <button class="back" onclick="goHome()">← Назад к расписанию</button>
            <div id="artistTitle" class="artist-title"></div>
            <div id="songsList"></div>
            <div id="linksBox"></div>
        </div>

        <div id="pageLyrics" class="page hidden">
            <button class="back" onclick="goToSongs()">← Назад к песням</button>
            <div class="lyrics-box fade">
                <div class="big-title" id="lyricTitle"></div>
                <div class="big-author" id="lyricAuthor"></div>
                <div class="divider"></div>
                <div class="text" id="lyricText"></div>
            </div>
        </div>

    </div>

    <script>
        // =============================================================
        // 🔧 БЫСТРАЯ ПРАВКА ВРЕМЕНИ
        // -------------------------------------------------------------
        // Когда кто-то опаздывает — впиши сюда строчку:
        //
        //   id: { newTime: "20:15", strike: true }
        //
        // id      — из ARTISTS ниже (не трогай)
        // newTime — новое время
        // strike  — true  = зачеркнуть старое и показать новое рядом
        //           false = просто заменить время
        //
        // Пусто = всё по базовому расписанию.
        // =============================================================

        const TIME_OVERRIDES = {
            18: { newTime: "20:00", strike: false },
            10: { newTime: "20:13", strike: true },
            11: { newTime: "20:25", strike: true },
            16: { newTime: "20:38", strike: true },
            1:  { newTime: "20:45", strike: true },
            13: { newTime: "20:55", strike: true },
            14: { newTime: "21:07", strike: true },
            8:  { newTime: "21:15", strike: true },
            4:  { newTime: "21:27", strike: true },
            5:  { newTime: "21:39", strike: true },
            3:  { newTime: "21:51", strike: true },
            19: { newTime: "22:01", strike: true },
            2:  { newTime: "22:13", strike: true },
            7:  { newTime: "22:23", strike: true },
            6:  { newTime: "22:35", strike: true },
            12: { newTime: "22:45", strike: true },
            9:  { newTime: "22:48", strike: true },
            17: { newTime: "22:55", strike: true },
            30: { newTime: "23:07", strike: true}
        };

        // =============================================================
        // ОСЕННИЕ ЛИСТЬЯ
        // =============================================================

        const LEAF_EMOJIS = ["🍁", "🍂", "🍃"];
        const LEAF_COUNT = 14;

        function createLeaves() {
            const container = document.getElementById('leaves');
            const small = window.innerWidth <= 600;
            for (let i = 0; i < LEAF_COUNT; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf' + (Math.random() < 0.3 ? ' blur' : '');
                leaf.textContent = LEAF_EMOJIS[Math.floor(Math.random() * LEAF_EMOJIS.length)];

                const size = small ? 38 + Math.random() * 40 : 56 + Math.random() * 64;
                leaf.style.left = (Math.random() * 100) + '%';
                leaf.style.fontSize = size + 'px';
                leaf.style.animationDuration = (16 + Math.random() * 16) + 's';
                leaf.style.animationDelay = (-Math.random() * 30) + 's';
                leaf.style.setProperty('--op', (0.3 + Math.random() * 0.3).toFixed(2));
                leaf.style.setProperty('--drift', (Math.random() * 160 - 80).toFixed(0) + 'px');
                leaf.style.setProperty('--rot', (Math.random() > 0.5 ? 1 : -1) * (200 + Math.random() * 360) + 'deg');

                container.appendChild(leaf);
            }
        }

        // =============================================================
        // ИСПОЛНИТЕЛИ
        // time — базовое время из расписания (до опозданий)
        // links — массив { label, url } (опционально)
        // isGroup — показывать бейдж "группа"
        // =============================================================

        const ARTISTS = [
            { id: 18, name: "Рыжкова Екатерина Алексеевна",                                time: "20:00" },
            { id: 10, name: "Курносов Владимир Александрович",                             time: "20:10" },
            { id: 11, name: "Определённо может быть",  isGroup: true,                      time: "20:20", links: [
                { label: "Telegram", url: "https://t.me/omb_band" },
                { label: "Альбом", url: "https://band.link/omb_album" }
            ]},
            { id: 16, name: "Первакова Тамара Михайловна",                                 time: "20:33", links: [
                { label: "Яндекс.Музыка", url: "https://music.yandex.by/album/38277557" }
            ]},
            { id: 1,  name: "Ася Горковенко",                                              time: "20:40" },
            { id: 13, name: "Мордвинова Алина Борисовна, Лабутина Людмила Валерьевна",     time: "20:50" },
            { id: 14, name: "Норец Илья Игоревич",                                         time: "21:02" },
            { id: 8,  name: "Калюжный Александр",                                          time: "21:10" },
            { id: 4,  name: "Ганицев Тимофей Алексеевич",                                  time: "21:22", links: [
                { label: "Telegram", url: "https://t.me/nuokey_music" }
            ]},
            { id: 5,  name: "Гимранов Равиль Римович, Горохов Артем Дмитриевич",           time: "21:34" },
            { id: 3, name: "Аня Парфенова, Гоша Чирков",                                   time: "21:46"},
            { id: 19, name: "Федоров Иван",                                                time: "21:56", links: [
                { label: "Яндекс.Музыка", url: "https://music.yandex.ru/album/43500939" }
            ]},

            { id: 2,  name: "Болгарев Михаил Андреевич",                                   time: "22:08" },
            { id: 7,  name: "Завадский Дмитрий Алексеевич",                                time: "22:18", links: [
                { label: "Telegram", url: "https://t.me/zavadmit" }
            ]},
            { id: 6,  name: "Еникеев Арнольд",                                             time: "22:30", links: [
                { label: "Telegram", url: "https://t.me/chmo_x" }
            ]},
            { id: 12, name: "Матвеев Николай Владимирович",                                time: "22:40" },
            { id: 9,  name: "Куприянова Софья Андреевна",                                  time: "22:43" },
            { id: 17, name: "Полозов Дмитрий Сергеевич",                                   time: "22:50" },
            { id: 30, name: "ОТКРЫТЫЙ МИКРОФОН!",                                          time: "23:02" }

        ];

        // =============================================================
        // ПЕСНИ
        // =============================================================

        const SONGS = [
            { id: 1,  artist_id: 1,  title: "Тяни!",                          author: "Король и Шут" },
            { id: 2,  artist_id: 1,  title: "Фанк",                           author: "Валентин Стрыкало" },

            { id: 7,  artist_id: 3,  title: "Прости. Прощай. Привет",         author: "Порнофильмы" },

            { id: 15, artist_id: 5,  title: "Полковнику никто не пишет",      author: "БИ-2" },
            { id: 16, artist_id: 5,  title: "Перемен",                        author: "Кино" },
            { id: 17, artist_id: 5,  title: "Кукла колдуна",                  author: "Король и Шут" },
            { id: 18, artist_id: 5,  title: "Последний герой",                author: "Кино" },

            { id: 19, artist_id: 6,  title: "Dead Weight",                    author: "PVRIS" },
            { id: 20, artist_id: 6,  title: "Еду, еду...",                    author: "Чиж & Co" },
            { id: 21, artist_id: 6,  title: "Мышеловка",                      author: "Гражданская оборона" },

            { id: 22, artist_id: 7,  title: "Those Who Wait",                 author: "Tommy Emmanuel" },
            { id: 23, artist_id: 7,  title: "Angelina",                       author: "Tommy Emmanuel" },
            { id: 24, artist_id: 7,  title: "Only Elliot",                    author: "Tommy Emmanuel" },
            { id: 25, artist_id: 7,  title: "Ruby's Eyes",                    author: "Tommy Emmanuel" },

        // =============================================================
        // ЛОГИКА
        // =============================================================

        function timeToMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function buildSchedule() {
            return ARTISTS.map(a => {
                const override = TIME_OVERRIDES[a.id];
                let displayTime = a.time;
                let oldTime = null;

                if (override) {
                    if (override.strike) {
                        oldTime = a.time;
                        displayTime = override.newTime;
                    } else {
                        displayTime = override.newTime;
                    }
                }

                return {
                    ...a,
                    displayTime,
                    oldTime,
                    sortKey: timeToMinutes(displayTime)
                };
            }).sort((x, y) => x.sortKey - y.sortKey);
        }

        function renderSchedule(filter = '') {
            const container = document.getElementById('schedule');
            const list = buildSchedule();
            const filtered = list.filter(item =>
                item.name.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML =
                    `<div style="text-align:center;color:rgba(247,237,224,0.35);padding:40px;">Ничего не найдено</div>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const timeHtml = item.oldTime
                    ? `<div class="time-block">
                           <div class="time-old">${item.oldTime}</div>
                           <div class="time-main">${item.displayTime}</div>
                       </div>`
                    : `<div class="time-block">
                           <div class="time-main">${item.displayTime}</div>
                       </div>`;

                html += `
                    <div class="row" onclick="openSongs(${item.id})">
                        ${timeHtml}
                        <div class="name">${item.name}</div>
                        ${item.isGroup ? '<span class="badge">группа</span>' : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function applyFilter() {
            renderSchedule(document.getElementById('searchInput').value);
        }

        function goHome() {
            document.getElementById('pageMain').classList.remove('hidden');
            document.getElementById('searchBox').style.display = 'block';
            document.getElementById('pageSongs').classList.add('hidden');
            document.getElementById('pageLyrics').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSongs(artistId) {
            const artist = ARTISTS.find(a => a.id === artistId);
            if (!artist) return;

            document.getElementById('pageMain').classList.add('hidden');
            document.getElementById('searchBox').style.display = 'none';
            document.getElementById('pageSongs').classList.remove('hidden');
            document.getElementById('pageLyrics').classList.add('hidden');

            document.getElementById('artistTitle').textContent = artist.name;

            const songs = SONGS.filter(s => s.artist_id === artistId);
            const list = document.getElementById('songsList');

            if (songs.length === 0) {
                list.innerHTML =
                    `<div style="color:rgba(247,237,224,0.35);padding:20px;">У этого исполнителя пока нет песен</div>`;
            } else {
                let html = '';
                songs.forEach((s, i) => {
                    html += `
                        <div class="song fade" onclick="openLyrics(${s.id})">
                            <div class="num">${i + 1}</div>
                            <div>
                                <div class="title">${s.title}</div>
                                <div class="author">${s.author}</div>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            }

            const linksBox = document.getElementById('linksBox');
            if (artist.links && artist.links.length > 0) {
                let linksHtml = `<div class="links-box fade"><div class="links-title">Ссылки</div>`;
                artist.links.forEach(l => {
                    linksHtml += `<a href="${l.url}" target="_blanks" rel="noopener">${l.label}</a>`;
                });
                linksHtml += `</div>`;
                linksBox.innerHTML = linksHtml;
            } else {
                linksBox.innerHTML = '';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToSongs() {
            document.getElementById('pageLyrics').classList.add('hidden');
            document.getElementById('pageSongs').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openLyrics(songId) {
            const song = SONGS.find(s => s.id === songId);
            if (!song) return;

            document.getElementById('pageSongs').classList.add('hidden');
            document.getElementById('pageLyrics').classList.remove('hidden');

            document.getElementById('lyricTitle').textContent = song.title;
            document.getElementById('lyricAuthor').textContent = song.author;

            // Если текста нет — заглушка «Название — Автор»
            const text = LYRICS[songId];
            const output = (text && text.trim() !== '')
                ? text
                : `${song.title} — ${song.author}`;
            document.getElementById('lyricText').textContent = output;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =============================================================
        // ЗАПУСК
        // =============================================================

        createLeaves();
        renderSchedule();

        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyFilter();
            }
        });
    </script>
